<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>命名即消解</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;700&family=Noto+Sans+SC:wght@300;400;500&display=swap');

  :root {
    --bg: #f7f5f0;
    --bg-deep: #eee9df;
    --text: #3a3630;
    --text-light: #7a746b;
    --text-muted: #a9a299;
    --green-dark: #5a7247;
    --green-mid: #7a9a62;
    --green-light: #a3bf8e;
    --green-pale: #c8dbb3;
    --accent: #8b6f4e;
    --card: rgba(255,255,252,0.85);
    --border: #d8d2c6;
    --bg-image: url('https://images.unsplash.com/photo-1532597668566-591132480e5f?auto=format&fit=crop&w=1800&q=80');
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    font-family: 'Noto Sans SC', sans-serif;
    background:
      linear-gradient(180deg, rgba(12, 24, 15, 0.64), rgba(10, 20, 12, 0.82)),
      var(--bg-image) center/cover fixed no-repeat;
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
    position: relative;
    transition: background-image 0.6s ease, background-color 0.6s ease;
  }

  body.theme-panel-open {
    overflow: hidden;
  }

  /* 背景纹理 */
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background:
      radial-gradient(ellipse at 18% 18%, rgba(240,244,223,0.12) 0%, transparent 34%),
      radial-gradient(ellipse at 82% 20%, rgba(209,220,189,0.11) 0%, transparent 33%),
      radial-gradient(ellipse at 72% 76%, rgba(248,250,241,0.08) 0%, transparent 24%),
      linear-gradient(180deg, rgba(20, 34, 22, 0.08), rgba(7, 15, 9, 0.18));
    filter: blur(10px);
    transform: scale(1.03);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    max-width: 720px;
    margin: 0 auto;
    padding: 60px 24px 80px;
    position: relative;
    z-index: 1;
  }

  .theme-toggle {
    position: fixed;
    top: 22px;
    right: 22px;
    width: 44px;
    height: 44px;
    border: 1px solid rgba(225, 233, 207, 0.42);
    border-radius: 14px;
    background: rgba(248, 250, 242, 0.12);
    color: rgba(239, 243, 231, 0.92);
    backdrop-filter: blur(18px);
    box-shadow: 0 16px 34px rgba(7, 14, 8, 0.22);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    z-index: 30;
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease, background 0.25s ease;
  }

  .theme-toggle:hover {
    transform: translateY(-1px);
    border-color: rgba(233, 239, 220, 0.7);
    background: rgba(248, 250, 242, 0.18);
    box-shadow: 0 20px 38px rgba(7, 14, 8, 0.26);
  }

  .theme-toggle svg {
    width: 20px;
    height: 20px;
  }

  .theme-toggle::after {
    content: '';
    position: absolute;
    inset: 6px;
    border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.08);
    pointer-events: none;
  }

  .theme-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(6, 10, 7, 0.46);
    backdrop-filter: blur(6px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease;
    z-index: 25;
  }

  .theme-backdrop.active {
    opacity: 1;
    pointer-events: auto;
  }

  .theme-drawer {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: min(340px, calc(100vw - 18px));
    padding: 22px 18px 24px;
    background: linear-gradient(180deg, rgba(11, 18, 12, 0.96), rgba(8, 14, 10, 0.98));
    border-left: 1px solid rgba(201, 215, 180, 0.18);
    box-shadow: -18px 0 42px rgba(4, 8, 5, 0.28);
    transform: translateX(100%);
    transition: transform 0.36s ease;
    z-index: 40;
    overflow-y: auto;
  }

  .theme-drawer.active {
    transform: translateX(0);
  }

  .theme-drawer-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
    padding: 2px 2px 10px;
  }

  .theme-drawer-title {
    font-family: 'Noto Serif SC', serif;
    font-size: 15px;
    letter-spacing: 2px;
    color: rgba(241, 245, 234, 0.92);
  }

  .theme-drawer-close {
    width: 38px;
    height: 38px;
    border: 1px solid rgba(201, 215, 180, 0.22);
    border-radius: 12px;
    background: rgba(248, 250, 242, 0.08);
    color: rgba(237, 242, 227, 0.86);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.2s ease, border-color 0.2s ease;
  }

  .theme-drawer-close:hover {
    background: rgba(248, 250, 242, 0.14);
    border-color: rgba(228, 235, 216, 0.42);
  }

  .theme-grid {
    display: grid;
    gap: 12px;
  }

  .theme-card {
    position: relative;
    min-height: 96px;
    border: 1px solid rgba(211, 224, 192, 0.14);
    border-radius: 16px;
    overflow: hidden;
    background: rgba(255,255,255,0.04);
    cursor: pointer;
    box-shadow: 0 14px 28px rgba(4, 8, 5, 0.18);
    transition: transform 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
    isolation: isolate;
  }

  .theme-card:hover {
    transform: translateY(-1px) scale(1.01);
    border-color: rgba(214, 228, 193, 0.42);
    box-shadow: 0 16px 32px rgba(4, 8, 5, 0.24);
  }

  .theme-card.active {
    border-color: rgba(210, 226, 185, 0.82);
    box-shadow: 0 0 0 1px rgba(210, 226, 185, 0.34), 0 16px 36px rgba(4, 8, 5, 0.28);
  }

  .theme-card-image {
    position: absolute;
    inset: 0;
    background-position: center;
    background-size: cover;
    transform: scale(1.02);
  }

  .theme-card::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, rgba(11, 18, 12, 0.08), rgba(8, 12, 9, 0.68));
    z-index: 1;
  }

  .theme-card::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: inherit;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.04);
    z-index: 3;
    pointer-events: none;
  }

  .theme-card-label {
    position: absolute;
    left: 16px;
    bottom: 14px;
    right: 48px;
    z-index: 2;
    font-family: 'Noto Serif SC', serif;
    font-size: 14px;
    letter-spacing: 2px;
    color: rgba(244, 247, 239, 0.96);
    text-align: left;
    text-shadow: 0 4px 20px rgba(0, 0, 0, 0.45);
  }

  .theme-card-check {
    position: absolute;
    top: 14px;
    right: 14px;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 1px solid rgba(239, 243, 231, 0.64);
    background: rgba(244, 247, 239, 0.16);
    color: rgba(251, 252, 249, 0.96);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    z-index: 2;
    opacity: 0;
    transform: scale(0.92);
    transition: opacity 0.22s ease, transform 0.22s ease;
  }

  .theme-card.active .theme-card-check {
    opacity: 1;
    transform: scale(1);
  }

  /* 头部 */
  .header {
    text-align: center;
    margin-bottom: 56px;
  }

  .header .icon {
    width: 58px;
    height: 58px;
    margin: 0 auto 20px;
    opacity: 0.78;
  }

  .header h1 {
    font-family: 'Noto Serif SC', serif;
    font-weight: 600;
    font-size: 28px;
    letter-spacing: 6px;
    color: #edf0df;
    margin-bottom: 12px;
    text-shadow: 0 6px 26px rgba(10, 16, 11, 0.38);
  }

  .header .subtitle {
    font-size: 14px;
    color: rgba(236, 240, 226, 0.7);
    letter-spacing: 2px;
    font-weight: 300;
    line-height: 1.8;
  }

  /* 输入区域 */
  .input-section {
    position: relative;
    margin-bottom: 32px;
  }

  .input-wrapper {
    position: relative;
    padding: 24px;
    background: rgba(252, 252, 247, 0.14);
    border: 1px solid rgba(225, 233, 207, 0.44);
    border-radius: 16px;
    backdrop-filter: blur(18px);
    transition: border-color 0.4s, box-shadow 0.4s;
  }

  .input-wrapper:focus-within {
    border-color: rgba(233, 239, 220, 0.76);
    box-shadow: 0 0 0 3px rgba(215, 227, 186, 0.1), 0 14px 34px rgba(8, 16, 10, 0.18);
  }

  .input-label {
    font-family: 'Noto Serif SC', serif;
    font-size: 13px;
    color: rgba(242, 246, 234, 0.82);
    letter-spacing: 2px;
    margin-bottom: 12px;
    display: block;
  }

  #userInput {
    width: 100%;
    min-height: 160px;
    border: none;
    outline: none;
    resize: vertical;
    font-family: 'Noto Sans SC', sans-serif;
    font-size: 16px;
    line-height: 1.9;
    color: #eef2e6;
    background: transparent;
    font-weight: 300;
  }

  #userInput::placeholder {
    color: rgba(231, 237, 221, 0.4);
    font-style: italic;
  }

  /* 草枝装饰 */
  .branch {
    position: absolute;
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.8s ease;
  }

  .input-wrapper:hover .branch,
  .input-wrapper.has-content .branch {
    opacity: 1;
  }

  .branch-tl { top: -8px; left: -8px; width: 80px; }
  .branch-tr { top: -8px; right: -8px; width: 80px; transform: scaleX(-1); }
  .branch-bl { bottom: -8px; left: -8px; width: 80px; transform: scaleY(-1); }
  .branch-br { bottom: -8px; right: -8px; width: 80px; transform: scale(-1,-1); }

  /* 按钮 */
  .btn-area {
    text-align: center;
    margin-bottom: 48px;
  }

  #dissolveBtn {
    font-family: 'Noto Serif SC', serif;
    font-size: 16px;
    letter-spacing: 4px;
    padding: 14px 48px;
    background: linear-gradient(90deg, rgba(126, 159, 72, 0.99) 0%, rgba(181, 209, 124, 0.98) 42%, rgba(235, 244, 208, 0.98) 100%);
    color: #33412d;
    border: none;
    border-radius: 999px;
    cursor: pointer;
    transition: all 0.3s ease;
    font-weight: 500;
    position: relative;
    overflow: hidden;
    box-shadow: 0 14px 28px rgba(9, 15, 10, 0.18), inset 0 1px 0 rgba(255,255,255,0.62);
  }

  #dissolveBtn:hover {
    background: linear-gradient(90deg, rgba(141, 173, 87, 1) 0%, rgba(193, 219, 138, 0.99) 42%, rgba(241, 248, 218, 1) 100%);
    box-shadow: 0 16px 32px rgba(9, 15, 10, 0.22), inset 0 1px 0 rgba(255,255,255,0.72);
    transform: translateY(-1px);
  }

  #dissolveBtn:active {
    transform: translateY(0);
  }

  #dissolveBtn:disabled {
    background: rgba(184, 191, 173, 0.72);
    cursor: not-allowed;
    transform: none;
    box-shadow: none;
  }

  .btn-note {
    margin-top: 16px;
    font-size: 13px;
    letter-spacing: 1px;
    color: rgba(237, 242, 227, 0.8);
    text-shadow: 0 4px 14px rgba(7, 12, 8, 0.3);
  }

  .section-divider {
    position: relative;
    width: 100%;
    margin: 52px auto 22px;
    height: 30px;
  }

  .section-divider::before,
  .section-divider::after {
    content: '';
    position: absolute;
    top: 50%;
    width: calc(50% - 28px);
    height: 1px;
    background: rgba(228, 235, 216, 0.18);
  }

  .section-divider::before {
    left: 0;
  }

  .section-divider::after {
    right: 0;
  }

  .section-divider-leaf {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 18px;
    height: 18px;
    transform: translate(-50%, -50%) rotate(8deg);
    color: rgba(222, 232, 201, 0.72);
    filter: drop-shadow(0 3px 8px rgba(7, 12, 8, 0.2));
  }

  /* 等待动画 */
  .waiting {
    display: none;
    text-align: center;
    padding: 60px 0;
  }

  .waiting.active { display: block; }

  .waiting .breath {
    width: 60px;
    height: 60px;
    margin: 0 auto 24px;
    border-radius: 50%;
    background: radial-gradient(circle, var(--green-pale) 0%, var(--green-light) 50%, transparent 70%);
    animation: breathe 4s ease-in-out infinite;
  }

  @keyframes breathe {
    0%, 100% { transform: scale(0.6); opacity: 0.4; }
    50% { transform: scale(1); opacity: 0.8; }
  }

  .waiting .hint {
    font-family: 'Noto Serif SC', serif;
    font-size: 14px;
    color: var(--text-muted);
    letter-spacing: 3px;
    animation: fadeInOut 4s ease-in-out infinite;
  }

  @keyframes fadeInOut {
    0%, 100% { opacity: 0.3; }
    50% { opacity: 1; }
  }

  /* 结果区域 */
  .result-section {
    display: none;
    animation: fadeUp 0.8s ease forwards;
  }

  .result-section.active { display: block; }

  .result-shell {
    position: relative;
    padding: 22px 18px;
  }

  .result-shell::before {
    content: '';
    position: absolute;
    inset: 6px;
    border-radius: 26px;
    pointer-events: none;
    background:
      linear-gradient(rgba(163,191,142,0.22), rgba(163,191,142,0.22)) left 18px top 30px / 86px 1px no-repeat,
      linear-gradient(rgba(163,191,142,0.22), rgba(163,191,142,0.22)) left 30px top 18px / 1px 86px no-repeat,
      linear-gradient(rgba(163,191,142,0.22), rgba(163,191,142,0.22)) right 18px top 30px / 86px 1px no-repeat,
      linear-gradient(rgba(163,191,142,0.22), rgba(163,191,142,0.22)) right 30px top 18px / 1px 86px no-repeat,
      linear-gradient(rgba(163,191,142,0.18), rgba(163,191,142,0.18)) left 18px bottom 30px / 86px 1px no-repeat,
      linear-gradient(rgba(163,191,142,0.18), rgba(163,191,142,0.18)) left 30px bottom 18px / 1px 86px no-repeat,
      linear-gradient(rgba(163,191,142,0.18), rgba(163,191,142,0.18)) right 18px bottom 30px / 86px 1px no-repeat,
      linear-gradient(rgba(163,191,142,0.18), rgba(163,191,142,0.18)) right 30px bottom 18px / 1px 86px no-repeat;
    z-index: 0;
  }

  .result-emblem {
    position: absolute;
    pointer-events: none;
    top: 50%;
    width: 42px;
    height: 132px;
    transform: translateY(-50%);
    z-index: 1;
  }

  .result-emblem::before {
    content: '';
    position: absolute;
    left: 50%;
    top: 16px;
    bottom: 16px;
    width: 1px;
    transform: translateX(-50%);
    background: linear-gradient(to bottom, transparent, rgba(163,191,142,0.2) 16%, rgba(163,191,142,0.2) 84%, transparent);
  }

  .result-emblem::after {
    content: '';
    position: absolute;
    left: 50%;
    top: 50%;
    width: 16px;
    height: 16px;
    border: 1px solid rgba(122,154,98,0.24);
    border-radius: 16px 16px 16px 3px;
    transform-origin: center;
    background: rgba(255,255,252,0.52);
    box-shadow: 0 0 0 4px rgba(255,255,252,0.38);
  }

  .result-emblem-left { left: 2px; }
  .result-emblem-right { right: 2px; }
  .result-emblem-left::after { transform: translate(-50%, -50%) rotate(-45deg); }
  .result-emblem-right::after { transform: translate(-50%, -50%) rotate(135deg); }

  .result-emblem span {
    position: absolute;
    left: 50%;
    top: calc(50% + 18px);
    width: 4px;
    height: 4px;
    transform: translateX(-50%);
    border-radius: 50%;
    background: rgba(139,111,78,0.26);
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .result-card {
    position: relative;
    z-index: 2;
    background: rgba(255,255,251,0.82);
    border: 1px solid rgba(226, 233, 212, 0.58);
    border-radius: 16px;
    padding: 40px 36px;
    backdrop-filter: blur(14px);
    box-shadow: 0 18px 40px rgba(6, 13, 8, 0.12);
  }

  .result-card .tag {
    display: inline-block;
    font-family: 'Noto Serif SC', serif;
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--green-dark);
    background: var(--green-pale);
    padding: 4px 12px;
    border-radius: 4px;
    margin-bottom: 24px;
  }

  .result-card .content {
    font-family: 'Noto Serif SC', serif;
    font-size: 15.5px;
    line-height: 2.1;
    color: var(--text);
    font-weight: 400;
  }

  .result-card .content p {
    margin-bottom: 16px;
  }

  .result-card .content strong {
    color: var(--green-dark);
    font-weight: 600;
  }

  .result-card .content em {
    color: var(--accent);
    font-style: normal;
    border-bottom: 1px solid var(--accent);
    padding-bottom: 1px;
  }

  .result-card .content h3 {
    font-size: 16px;
    font-weight: 600;
    color: var(--green-dark);
    margin: 28px 0 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--green-pale);
    letter-spacing: 2px;
  }

  .result-card .content h3:first-child {
    margin-top: 0;
  }

  .result-card .content ul {
    padding-left: 20px;
    margin-bottom: 16px;
  }

  .result-card .content li {
    margin-bottom: 6px;
  }

  .result-card .divider {
    width: 40px;
    height: 1px;
    background: var(--green-pale);
    margin: 24px auto;
  }

  .result-card .naming {
    text-align: center;
    margin: 24px 0;
    padding: 24px;
    background: rgba(163,191,142,0.08);
    border-radius: 12px;
    border: 1px dashed var(--green-light);
  }

  .result-card .naming .label {
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .result-card .naming .name {
    font-family: 'Noto Serif SC', serif;
    font-size: 20px;
    font-weight: 700;
    color: var(--green-dark);
    letter-spacing: 4px;
  }

  /* 底部 */
  .footer {
    margin-top: 0;
    padding-top: 0;
    width: min(1200px, calc(100vw - 96px));
    position: relative;
    left: 50%;
    transform: translateX(-50%);
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 28px;
    align-items: end;
    justify-items: center;
  }

  .footer p {
    font-size: 12px;
    color: rgba(233, 238, 225, 0.72);
    letter-spacing: 1px;
    line-height: 1.8;
    font-family: 'Noto Serif SC', serif;
  }

  .footer-center {
    text-align: center;
    justify-self: center;
  }

  .footer-side {
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 0;
    max-width: 220px;
    justify-self: center;
  }

  .footer-side.right {
    justify-self: center;
  }

  .footer-side-icon {
    width: 20px;
    height: 20px;
    flex: 0 0 auto;
    color: rgba(227, 235, 211, 0.8);
  }

  .footer-side-title {
    display: block;
    font-size: 12px;
    letter-spacing: 4px;
    color: rgba(239, 243, 231, 0.86);
    margin-bottom: 2px;
  }

  .footer-side-text {
    font-size: 11px;
    letter-spacing: 1px;
    color: rgba(224, 231, 214, 0.62);
  }

  /* 错误提示 */
  .error-msg {
    display: none;
    text-align: center;
    padding: 24px;
    color: var(--accent);
    font-size: 14px;
    font-family: 'Noto Serif SC', serif;
    letter-spacing: 1px;
  }

  .error-msg.active { display: block; }

  /* 响应式 */
  @media (max-width: 640px) {
    .container { padding: 40px 16px 60px; }
    .header h1 { font-size: 22px; letter-spacing: 4px; }
    .result-card { padding: 28px 20px; }
    #dissolveBtn { padding: 12px 36px; font-size: 15px; }
    .theme-toggle {
      top: 16px;
      right: 16px;
      width: 40px;
      height: 40px;
      border-radius: 12px;
    }

    .theme-drawer {
      width: min(100vw, 320px);
      padding: 18px 12px 20px;
    }

    .theme-drawer-header {
      margin-bottom: 14px;
    }

    .theme-card {
      min-height: 84px;
      border-radius: 14px;
    }

    .theme-card-label {
      left: 14px;
      bottom: 12px;
      font-size: 13px;
      right: 44px;
    }

    .theme-card-check {
      top: 12px;
      right: 12px;
      width: 22px;
      height: 22px;
    }

    .result-shell {
      padding: 14px 10px;
    }

    .result-shell::before {
      inset: 4px;
      background:
        linear-gradient(rgba(163,191,142,0.2), rgba(163,191,142,0.2)) left 12px top 22px / 54px 1px no-repeat,
        linear-gradient(rgba(163,191,142,0.2), rgba(163,191,142,0.2)) left 22px top 12px / 1px 54px no-repeat,
        linear-gradient(rgba(163,191,142,0.2), rgba(163,191,142,0.2)) right 12px top 22px / 54px 1px no-repeat,
        linear-gradient(rgba(163,191,142,0.2), rgba(163,191,142,0.2)) right 22px top 12px / 1px 54px no-repeat,

function startHintRotation() {

function escapeHtml(text) {
  return text
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

function formatInline(text) {
  return escapeHtml(text)
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>');
}

function renderMarkdown(text) {
  const lines = text.split(/\r?\n/);
  const blocks = [];
  let paragraphLines = [];
  let listItems = [];

  function flushParagraph() {
    if (!paragraphLines.length) {
      return;
    }

    blocks.push(`<p>${paragraphLines.join('<br>')}</p>`);
    paragraphLines = [];
  }

  function flushList() {
    if (!listItems.length) {
      return;
    }

    blocks.push(`<ul>${listItems.map(item => `<li>${item}</li>`).join('')}</ul>`);
    listItems = [];
  }

  for (const rawLine of lines) {
    const line = rawLine.trim();

    if (!line) {
      flushParagraph();
      flushList();
      continue;
    }

    if (/^---+$/.test(line)) {
      flushParagraph();
      flushList();
      blocks.push('<div class="divider"></div>');
      continue;
    }

    const headingMatch = line.match(/^#{2,3}\s+(.+)$/);
    if (headingMatch) {
      flushParagraph();
      flushList();
      blocks.push(`<h3>${formatInline(headingMatch[1])}</h3>`);
      continue;
    }

    const listMatch = line.match(/^(?:[•·-]|\d+\.)\s+(.+)$/);
    if (listMatch) {
      flushParagraph();
      listItems.push(formatInline(listMatch[1]));
      continue;
    }

    flushList();
    paragraphLines.push(formatInline(line));
  }

  flushParagraph();
  flushList();

  return blocks.join('');
}

function normalizeGeneratedHtml(text) {
  return text
    .trim()
    .replace(/^```html\s*/i, '')
    .replace(/^```\s*/i, '')
    .replace(/\s*```$/, '')
    .trim();
}

function isHtmlFragment(text) {
  return /<([a-z]+)(\s|>)/i.test(text);
}

function renderResult(text) {
  const normalizedText = normalizeGeneratedHtml(text);

  if (isHtmlFragment(normalizedText)) {
    resultTag.textContent = `${DEFAULT_RESULT_TAG} · ${MODEL_LABEL}`;
    resultContent.innerHTML = normalizedText;
    resultSection.classList.add('active');
    return;
  }

  const firstLine = normalizedText.split('\n').find(line => line.trim().length > 0 && !line.startsWith('#')) || '';
  const namingMatch = firstLine.match(/[【\[](.+?)[】\]]/);
  const namingText = namingMatch ? namingMatch[1] : '';

  let displayText = normalizedText;
  let htmlContent = '';

  resultTag.textContent = `${DEFAULT_RESULT_TAG} · ${MODEL_LABEL}`;
  if (namingText) {
    htmlContent += `
      <div class="naming">
        <div class="label">困 境 命 名</div>
        <div class="name">${escapeHtml(namingText)}</div>
      </div>
      <div class="divider"></div>
    `;
    displayText = normalizedText.replace(firstLine, '').trim();
  }

  htmlContent += renderMarkdown(displayText);
  resultContent.innerHTML = htmlContent;
  resultSection.classList.add('active');
}

async function streamCompletion(messages, onChunk) {
  const response = await fetch(API_URL, {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': API_KEY,
    },
    body: JSON.stringify({
      model: MODEL,
      messages,
      stream: true,
    }),
  });

  if (!response.ok) {
    throw new Error(await response.text());
  }

  if (!response.body) {
    throw new Error('流式响应不可用');
  }

  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  let fullText = '';

  while (true) {
    const { done, value } = await reader.read();
    if (done) {
      break;
    }

    buffer += decoder.decode(value, { stream: true });

    let splitIndex;
    while ((splitIndex = buffer.indexOf('\n\n')) !== -1) {
      const event = buffer.slice(0, splitIndex);
      buffer = buffer.slice(splitIndex + 2);

      for (const line of event.split('\n')) {
        if (!line.startsWith('data: ')) {
          continue;
        }

        const data = line.slice(6);
        if (data === '[DONE]') {
          return fullText;
        }

        const json = JSON.parse(data);
        const text = json.choices?.[0]?.delta?.content;
        if (text) {
          fullText += text;
          onChunk(fullText);
        }
      }
    }
  }

  return fullText;
}

  try {
    startHintRotation();

    const messages = [
      { role: 'system', content: SYSTEM_PROMPT },
      { role: 'user', content: prompt }
    ];

    const aiText = await streamCompletion(messages, (partialText) => {
      stopHintRotation();
      waiting.classList.remove('active');
      renderResult(partialText);
    });

    stopHintRotation();
    waiting.classList.remove('active');
    renderResult(aiText);

    // 滚动到结果区
    setTimeout(() => {
      resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);

  } catch (err) {
    stopHintRotation();
    waiting.classList.remove('active');
    showError('消解过程出现波折：' + err.message + '，请稍后再试。');

themeToggle.addEventListener('click', () => {
  if (themeDrawer.classList.contains('active')) {
    closeThemeDrawer();
    return;
  }

  openThemeDrawer();
});

themeClose.addEventListener('click', closeThemeDrawer);
themeBackdrop.addEventListener('click', closeThemeDrawer);

themeGrid.addEventListener('click', (event) => {
  const card = event.target.closest('.theme-card');
  if (!card) {
    return;
  }

  applyBackgroundTheme(card.dataset.themeId);
  closeThemeDrawer();
});

document.addEventListener('keydown', (event) => {
  if (event.key === 'Escape' && themeDrawer.classList.contains('active')) {
    closeThemeDrawer();
  }
});

// 支持 Ctrl+Enter 提交
userInput.addEventListener('input', syncInputDecorationState);
userInput.addEventListener('keydown', (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    dissolveBtn.click();
  }
});

renderThemeOptions();
applyBackgroundTheme(activeThemeId);
syncInputDecorationState();
</script>
